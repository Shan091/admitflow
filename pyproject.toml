[project]
name = "admitflow"
version = "0.1.0"
description = "Hackathon demo of an admissions assistant with grounded FAQ retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "langfuse>=3,<4",
  "numpy>=2.1,<3",
  "openai>=3.26.1,<4",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=22.5,<23",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admitflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = []
packages = ["admitflow"]

[tool.uv]
package = true
