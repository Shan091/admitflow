# Isolated local development; preserves the existing readiness profile and its volumes.
name: admitflow-local

x-backend: &backend
  image: admitflow-backend:local
  pull_policy: never
  env_file: .env
  init: true
  restart: unless-stopped

x-dependencies: &dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  bootstrap:
    condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: admitflow
      POSTGRES_DB: admitflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the configure_compose script first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U admitflow -d admitflow"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  bootstrap:
    <<: *backend
    restart: "no"
    command: [sh, -c, ".venv/bin/alembic upgrade head && .venv/bin/python -m src.scripts.seed_demo"]
    volumes:
      - demo-credentials:/run/admitflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  api:
    <<: *backend
    build: ./backend
    ports:
      - "127.0.0.1:18000:8000"
    depends_on: *dependencies
    healthcheck:
      test: [CMD, .venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=6)"]
      interval: 5s
      timeout: 8s
      retries: 20
  worker:
    <<: *backend
    command: [.venv/bin/taskiq, worker, "src.tasks.broker:broker", src.tasks.processing, src.tasks.telegram, src.tasks.knowledge, src.tasks.followups, src.tasks.integrations, --workers, "1"]
    depends_on: *dependencies
  scheduler:
    <<: *backend
    command: [.venv/bin/python, -m, src.scripts.scheduler]
    depends_on: *dependencies
  receiver:
    <<: *backend
    profiles: [telegram]
    command: [.venv/bin/python, -m, src.telegram.receiver]
    depends_on: *dependencies
  frontend:
    build: ./frontend
    image: admitflow-frontend:local
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  demo-credentials:
