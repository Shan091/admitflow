# Alembic configuration for AdmitFlow.
# The database URL is NOT set here — env.py reads it from application settings
# (DATABASE_URL) so there is one source of truth and no secrets in the repo.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Migration filenames: <YYYYMMDD>_<slug>_<rev>. Keeps versions/ readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s_%%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
