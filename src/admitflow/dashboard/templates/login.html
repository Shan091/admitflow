<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login - AdmitFlow Demo</title>
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth">
  <h1>AdmitFlow staff login</h1>
  {% if not configured %}<p class="notice">Staff login is not configured. Set STAFF_USERNAME, STAFF_PASSWORD, and STAFF_SESSION_SECRET in your local environment.</p>
  {% else %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  {% endif %}
</body>
</html>
