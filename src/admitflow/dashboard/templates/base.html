<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "AdmitFlow Demo" }}</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 980px; margin: 2rem auto; padding: 0 1rem; color: #18212f; }
    header { border-bottom: 1px solid #d8dee8; margin-bottom: 1.5rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: .65rem; border-bottom: 1px solid #d8dee8; text-align: left; }
    .notice { background: #fff4d6; padding: .75rem; border-radius: .4rem; }
    .success { background: #e8f7ec; padding: .75rem; border-radius: .4rem; }
    .danger-zone { margin-top: 2rem; padding: 1rem; border: 1px solid #b42318; border-radius: .4rem; }
    .danger-zone summary { color: #b42318; cursor: pointer; font-weight: 650; }
    .danger-zone label { display: block; margin: .75rem 0 .25rem; }
    .danger-zone input { padding: .5rem; }
    .danger-button { display: block; margin-top: .75rem; padding: .6rem 1rem; color: white; background: #b42318; border: 0; border-radius: .3rem; cursor: pointer; }
    .msg { padding: .5rem .75rem; margin: .5rem 0; border-radius: .4rem; background: #f1f4f8; }
    .outbound { margin-left: 2rem; background: #e8f3ff; }
  </style>
</head>
<body>
  <header><h1><a href="/">AdmitFlow</a> <small>fictional demo</small></h1>
  {% if staff_authenticated %}<form method="post" action="/logout"><button type="submit">Log out</button></form>{% endif %}</header>
  {% if not rag_ready %}<p class="notice">FAQ retrieval is unavailable until OpenAI embeddings are configured and indexed.</p>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
